name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'porkbun/**'
      - 'examples/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'porkbun/**'
      - 'examples/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run unit tests
        run: pytest tests/unit/

      - name: Run linting
        run: |
          flake8 porkbun/
          flake8 examples/ --ignore=E501,E122
          
      - name: Validate all template files
        run: |
          python -c "
          import json, glob, sys;
          templates_valid = True;
          for f in glob.glob('examples/templates/*.json'):
              try:
                  with open(f, 'r') as file:
                      data = json.load(file)
                  print(f'✓ Template {f} is valid JSON')
              except json.JSONDecodeError as e:
                  print(f'✗ Template {f} has invalid JSON: {e}')
                  templates_valid = False
          if not templates_valid:
              sys.exit(1)
          "

      - name: Test template customization script
        run: |
          python examples/customize_template.py examples/templates/office365.json example.com
          python examples/customize_template.py examples/templates/google_workspace.json example.com
          python examples/customize_template.py examples/templates/cloudflare_dns.json example.com
          python examples/customize_template.py examples/templates/netlify.json example.com

      - name: Check setup script help
        run: python examples/setup_domain_services.py --help

      - name: Test setup script (dry run)
        run: |
          python examples/setup_domain_services.py example.com --service google --dry-run
          python examples/setup_domain_services.py example.com --service all --dry-run

      - name: Upload test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            example.com_*.json
            configs_example.com/ 